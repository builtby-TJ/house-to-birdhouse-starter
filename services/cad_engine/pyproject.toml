[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birdhouse-cad"
version = "0.1.0"
description = "Prototype six-part house-to-birdhouse geometry and API service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "trimesh>=4.0,<5",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
production-cad = [
  "cadquery==2.8.0",
  "cadquery-ocp==7.9.3.1.1"
]

[project.scripts]
birdhouse-cad = "birdhouse_cad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
