services:
  api:
    build:
      context: ..
      dockerfile: services/cad_engine/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - generated_jobs:/app/generated_jobs

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: birdhouse
      POSTGRES_PASSWORD: birdhouse_dev
      POSTGRES_DB: birdhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  generated_jobs:
  postgres_data:
