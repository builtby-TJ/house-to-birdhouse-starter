name: Container smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web-build:
    name: Build operator web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  cad-api-image:
    name: Build CAD API image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build CAD API container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cad_engine/Dockerfile
          push: false
